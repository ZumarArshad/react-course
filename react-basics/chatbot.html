<!doctype html>
<html>
  <head>
    <title>ChatBot</title>
 
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f2f5;
        font-family: sans-serif;
      }

      .chat-app {
        display: flex;
        flex-direction: column;
        width: 480px;
        height: 80vh;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .chat-header {
        padding: 16px 20px;
        background: #4f46e5;
        color: #fff;
        flex-shrink: 0;
      }

      .chat-header h1 {
        font-size: 1.2rem;
      }

      .chat-header p {
        font-size: 0.85rem;
        opacity: 0.85;
        margin-top: 2px;
      }

      .chat-body {
        display: flex;
        flex-direction: column;
        flex: 1;
        overflow: hidden;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .message-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
      }

      .message-row.user {
        flex-direction: row-reverse;
      }

      .avatar img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: cover;
      }

      .message-bubble {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 18px;
        font-size: 0.9rem;
        line-height: 1.4;
        background: #e5e7eb;
        color: #111;
      }

      .message-row.user .message-bubble {
        background: #4f46e5;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .message-row.robot .message-bubble {
        border-bottom-left-radius: 4px;
      }

      .input-area {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid #e5e7eb;
        flex-shrink: 0;
        background: #fff;
      }

      .input-area input {
        flex: 1;
        padding: 10px 14px;
        border: 1px solid #d1d5db;
        border-radius: 24px;
        font-size: 0.9rem;
        outline: none;
      }

      .input-area input:focus {
        border-color: #4f46e5;
      }

      .input-area button {
        padding: 10px 18px;
        background: #4f46e5;
        color: #fff;
        border: none;
        border-radius: 24px;
        font-size: 0.9rem;
        cursor: pointer;
      }

      .input-area button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>
    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev@8.0.1/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ setChatMessages }) {
        const [inputValue, setInputValue] = React.useState("");
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputValue(event) {
          setInputValue(event.target.value);
        }

        async function sendMessage() {
          const messageText = inputValue.trim();
          if (!messageText || isLoading) {
            return;
          }

          const userMessageId = `id${Date.now()}`;
          const loadingMessageId = `id${Date.now() + 1}`;
          const newMessage = {
            message: messageText,
            sender: "user",
            id: userMessageId
          };
          const loadingMessage = {
            message: "Thinking...",
            sender: "robot",
            id: loadingMessageId
          };

          setIsLoading(true);
          setChatMessages((prevMessages) => [...prevMessages, newMessage, loadingMessage]);
          setInputValue("");

          let botMessage;
          try {
            const response = await Chatbot.getResponseAsync(messageText);
            botMessage = {
              message: response,
              sender: "robot",
              id: `id${Date.now() + 2}`
            };
          } finally {
            setChatMessages((prevMessages) => {
              const messagesWithoutLoading = prevMessages.filter(
                (message) => message.id !== loadingMessageId
              );
              if (!botMessage) {
                return messagesWithoutLoading;
              }
              return [...messagesWithoutLoading, botMessage];
            });
            setIsLoading(false);
          }
        }

        return (
          <div className="input-area">
            <input
              type="text"
              placeholder="Send a message to the chatbot"
              onChange={saveInputValue}
              value={inputValue}
              disabled={isLoading}
              onKeyDown={(event) => {
                if (event.key === "Enter" && inputValue.trim() && !isLoading) {
                  sendMessage();
                }
                if (event.key === "Escape") {
                  setInputValue("");
                }
              }}
            />
            <button onClick={sendMessage} disabled={!inputValue.trim() || isLoading}>
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div className={`message-row ${sender === "user" ? "user" : "robot"}`}>
            {sender === "robot" && (
              <div className="avatar">
                <img src="robot.png" alt="Robot" />
              </div>
            )}
            <div className="message-bubble">{message}</div>
            {sender === "user" && (
              <div className="avatar">
                <img src="user.png" alt="User" />
              </div>
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        const messagesEndRef = React.useRef(null);

        React.useEffect(() => {
          messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        }, [chatMessages]);

        return (
          <div className="messages">
            {chatMessages.map((chatMessage) => (
              <ChatMessage
                message={chatMessage.message}
                sender={chatMessage.sender}
                key={chatMessage.id}
              />
            ))}
            <div ref={messagesEndRef} />
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello! I’m your friendly chatbot.",
            sender: "user",
            id: "id1"
          },
          {
            message: "Hello! How can I help you today?",
            sender: "robot",
            id: "id2"
          },
          {
            message: "Can you get me today's date?",
            sender: "user",
            id: "id3"
          },
          {
            message: `Today's date is ${dayjs().format("MMMM D")}`,
            sender: "robot",
            id: "id4"
          }
        ]);

        return (
          <div className="chat-app">
            <div className="chat-header">
              <h1>Chat Application</h1>
              <p>Ask anything and I’ll respond instantly.</p>
            </div>
            <div className="chat-body">
              <ChatMessages chatMessages={chatMessages} />
              <ChatInput setChatMessages={setChatMessages} />
            </div>
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
